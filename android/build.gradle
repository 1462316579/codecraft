allprojects {
    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/central" }
        // 镜像不可用时的官方兜底仓库
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// 为所有子项目预先创建 aar_metadata_check 目录，避免 BundleAar 任务
// 配置期因目录不存在而校验失败；同时禁用 lint 和 AarMetadata 相关任务，
// 绕过 audioplayers_android 等 plugin 子项目（compileSdk 33）与 androidx 库
//（要求 compileSdk >= 34）的版本冲突。
gradle.projectsEvaluated {
    subprojects { project ->
        def buildDir = project.buildDir
        if (buildDir) {
            def metadataDir = new File(buildDir, "intermediates/aar_metadata_check/release/checkReleaseAarMetadata")
            metadataDir.mkdirs()
        }
        project.tasks.matching {
            def name = it.name.toLowerCase()
            name.contains('lint') || name.contains('aarmetadata')
        }.configureEach { it.enabled = false }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
