name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android:
    name: Build Android Universal Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 /opt/flutter
          /opt/flutter/bin/flutter --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Set up Android signing
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Get Flutter dependencies
        run: |
          export PATH=/opt/flutter/bin:$PATH
          flutter pub get

      - name: Build Android APK (release, universal)
        run: |
          export PATH=/opt/flutter/bin:$PATH
          export JAVA_HOME=$JAVA_HOME_17_X64
          flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64
          DIR=build/app/outputs/flutter-apk
          if [ -f "$DIR/app-release.apk" ]; then mv "$DIR/app-release.apk" "$DIR/codecraft-universal-release.apk"; fi
          ls -la "$DIR"

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codecraft-universal-release-apk
          path: build/app/outputs/flutter-apk/codecraft-universal-release.apk
          retention-days: 7
