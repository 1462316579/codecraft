name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '27'

      - name: Set up Flutter 3.44
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.44 --depth 1 /opt/flutter
          /opt/flutter/bin/flutter --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools,platforms;android-35,build-tools;35.0.0

      - name: Install Android NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME

      - name: Get Flutter dependencies
        run: |
          export PATH=/opt/flutter/bin:$PATH
          flutter pub get

      - name: Build Android APK (debug)
        run: |
          export PATH=/opt/flutter/bin:$PATH
          cd android
          ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
