name: codecraft
description: "codecraft"
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.0.0
  archive: ^3.0.0
  audioplayers: ^6.0.0
  basic_utils: ^5.0.0
  crypto: ^3.0.0
  dio: ^5.0.0
  file_selector: ^1.0.3
  flutter_markdown: ^0.7.0
  flutter_svg: ^2.0.0
  go_router: ^13.0.0
  highlight: ^0.7.0
  image: ^4.0.0
  image_picker: ^1.0.0
  intl: ^0.20.3
  kyroon_pty: ^1.0.0
  path: ^1.9.0
  path_provider: ^2.0.0
  share_plus: ^9.0.0
  shared_preferences: ^2.3.0
  sqflite: ^2.0.0
  url_launcher: ^6.0.0
  uuid: ^4.0.0
  video_player: ^2.8.0
  webview_flutter: ^4.0.0
  webview_flutter_android: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono_nl.ttf
    - family: Iconfont
      fonts:
        - asset: assets/fonts/iconfont.ttf

  generate: true

  assets:
    - LICENSE
    - assets/logos/
    - assets/models/
    - assets/codecraft/
    - assets/codecraft/bin/
    - assets/codecraft/lib/
    - assets/codecraft/lib/scenarios/
    - assets/codecraft/scripts/
    - assets/prompts/
    - assets/prompts/agent/
    - assets/prompts/scenarios/
    - assets/announcements/
    - assets/skills/
    - assets/skills/writing/
    - assets/skills/coding/
    - assets/skills/reverse/
