version: 1.0.{build}
image: Visual Studio 2022
clone_depth: 1

init:
  - git config --global core.autocrlf input

environment:
  FLUTTER_HOME: C:\flutter
  PATH: C:\flutter\bin;%PATH%

install:
  - if exist "%FLUTTER_HOME%" rmdir /s /q "%FLUTTER_HOME%"
  - git clone https://github.com/flutter/flutter.git -b stable --depth 1 "%FLUTTER_HOME%"
  - "%FLUTTER_HOME%/bin/flutter --version"

build_script:
  - flutter pub get
  - set JAVA_HOME= && for /d %%d in ("C:\Program Files\Java\jdk-17*") do set JAVA_HOME=%%d && if "%JAVA_HOME%"=="" for /d %%d in ("C:\Program Files\Java\jdk-*") do set JAVA_HOME=%%d && java -version && flutter build apk --release

artifacts:
  - path: build/app/outputs/**/*.apk
